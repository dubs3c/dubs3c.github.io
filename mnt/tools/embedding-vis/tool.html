<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Optimized Embedding Visualization</title>

        <!-- Import map for ES modules -->
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
                }
            }
        </script>

        <style>
            :root {
                color-scheme: light dark;
                --dark-bg: #1b1b20;
                --light-bg: color(srgb 0.9773 0.9724 0.964);
            }

            body {
                background: light-dark(var(--light-bg), var(--dark-bg));
            }
            .embedding-container {
                width: 100%;
                height: 500px;
                position: relative;
                overflow: hidden;
                border-radius: 8px;
                margin: 20px 0;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            .embedding-tooltip {
                position: absolute;
                background: rgba(10, 10, 30, 0.85);
                color: white;
                padding: 10px;
                border-radius: 4px;
                font-size: 14px;
                pointer-events: none;
                display: none;
                z-index: 100;
                max-width: 200px;
                border: 1px solid rgba(100, 100, 255, 0.2);
                font-family: Arial, sans-serif;
            }

            .embedding-tooltip strong {
                color: #aaddff;
                margin-bottom: 4px;
                display: block;
            }

            .embedding-caption {
                position: absolute;
                bottom: 10px;
                width: 100%;
                text-align: center;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.7);
                z-index: 10;
                pointer-events: none;
                font-family: Arial, sans-serif;
                background: rgba(0, 0, 0, 0.4);
                padding: 5px 0;
            }

            .embedding-loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 16px;
                background-color: rgba(0, 0, 20, 0.7);
                padding: 10px 20px;
                border-radius: 5px;
                z-index: 200;
                font-family: Arial, sans-serif;
            }

            .embedding-legend {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(10, 10, 30, 0.7);
                padding: 8px;
                border-radius: 4px;
                color: white;
                font-size: 12px;
                font-family: Arial, sans-serif;
                z-index: 100;
            }

            .legend-item {
                display: flex;
                align-items: center;
                margin-bottom: 3px;
            }

            .color-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                margin-right: 6px;
                display: inline-block;
            }

            #fps-counter {
                position: absolute;
                bottom: 10px;
                left: 10px;
                color: rgba(255, 255, 255, 0.5);
                font-size: 10px;
                font-family: monospace;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <div class="embedding-container" id="embedding-viz">
            <div class="embedding-tooltip" id="embedding-tooltip"></div>
            <div class="embedding-loading" id="embedding-loading">
                Loading visualization...
            </div>
            <div class="embedding-caption">
                Explore the 3D embedding space by dragging to rotate and
                scrolling to zoom
            </div>
            <div class="embedding-legend">
                <div class="legend-item">
                    <span
                        class="color-dot"
                        style="background-color: #4285f4"
                    ></span>
                    <span>Animals</span>
                </div>
                <div class="legend-item">
                    <span
                        class="color-dot"
                        style="background-color: #ea4335"
                    ></span>
                    <span>Vehicles</span>
                </div>
                <div class="legend-item">
                    <span
                        class="color-dot"
                        style="background-color: #fbbc05"
                    ></span>
                    <span>Objects</span>
                </div>
            </div>
            <div id="fps-counter"></div>
        </div>

        <!-- ES modules script - performance optimized -->
        <script type="module">
            // Import Three.js - using a more stable version
            import * as THREE from "three";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";

            // Performance monitoring
            let frameCount = 0;
            let lastTime = performance.now();
            const fpsCounter = document.getElementById("fps-counter");

            // Main function to initialize visualization
            function initEmbeddingVisualization() {
                try {
                    // Get DOM elements
                    const container = document.getElementById("embedding-viz");
                    const loadingElement =
                        document.getElementById("embedding-loading");
                    const tooltipElement =
                        document.getElementById("embedding-tooltip");

                    // Main scene setup - simplified
                    const scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x0a0a20);

                    // Camera setup
                    const camera = new THREE.PerspectiveCamera(
                        60,
                        container.clientWidth / container.clientHeight,
                        0.1,
                        1000,
                    );
                    camera.position.set(0, 0, 15);

                    // Renderer setup - optimized
                    const renderer = new THREE.WebGLRenderer({
                        antialias: false, // Disable for performance
                        powerPreference: "high-performance",
                    });
                    renderer.setSize(
                        container.clientWidth,
                        container.clientHeight,
                    );

                    // Use a lower pixel ratio for performance if needed
                    const pixelRatio = Math.min(window.devicePixelRatio, 1.5);
                    renderer.setPixelRatio(pixelRatio);

                    container.appendChild(renderer.domElement);

                    // Simple lighting
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                    scene.add(ambientLight);

                    const directionalLight = new THREE.DirectionalLight(
                        0xffffff,
                        0.5,
                    );
                    directionalLight.position.set(5, 5, 5);
                    scene.add(directionalLight);

                    // Orbit controls - simplified
                    const controls = new OrbitControls(
                        camera,
                        renderer.domElement,
                    );
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.1;
                    controls.rotateSpeed = 0.7;
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = 0.5;
                    controls.enablePan = false; // Disable panning for simpler interaction

                    // Data for our embedding visualization
                    // Format: [x, y, z, label, category, description]
                    const embeddingData = [
                        // Animals (blue cluster)
                        [
                            2.5,
                            1.8,
                            3.2,
                            "Cat",
                            "animals",
                            "Domestic feline, common house pet",
                        ],
                        [
                            2.2,
                            1.5,
                            3.0,
                            "Dog",
                            "animals",
                            "Domestic canine, loyal companion",
                        ],
                        [
                            2.0,
                            1.2,
                            2.7,
                            "Wolf",
                            "animals",
                            "Wild canine, pack hunter",
                        ],
                        [
                            1.8,
                            2.0,
                            3.5,
                            "Tiger",
                            "animals",
                            "Large feline, striped predator",
                        ],
                        [
                            1.5,
                            1.7,
                            3.3,
                            "Lion",
                            "animals",
                            "Large feline, pride leader",
                        ],
                        [
                            2.3,
                            2.1,
                            4.0,
                            "Bear",
                            "animals",
                            "Large omnivore, hibernates",
                        ],
                        [
                            3.0,
                            2.5,
                            2.5,
                            "Elephant",
                            "animals",
                            "Large land mammal with trunk",
                        ],

                        // Vehicles (red cluster)
                        [
                            -2.0,
                            -1.5,
                            -2.5,
                            "Car",
                            "vehicles",
                            "Four-wheeled personal transport",
                        ],
                        [
                            -2.3,
                            -1.8,
                            -2.2,
                            "Truck",
                            "vehicles",
                            "Large vehicle for transporting goods",
                        ],
                        [
                            -2.5,
                            -2.0,
                            -3.0,
                            "Bus",
                            "vehicles",
                            "Large passenger transport vehicle",
                        ],
                        [
                            -3.0,
                            -2.2,
                            -2.8,
                            "Motorcycle",
                            "vehicles",
                            "Two-wheeled personal transport",
                        ],
                        [
                            -1.8,
                            -1.2,
                            -2.0,
                            "Bicycle",
                            "vehicles",
                            "Human-powered two-wheeled vehicle",
                        ],
                        [
                            -2.7,
                            -3.0,
                            -3.5,
                            "Airplane",
                            "vehicles",
                            "Flying vehicle with wings",
                        ],
                        [
                            -3.2,
                            -2.8,
                            -3.2,
                            "Helicopter",
                            "vehicles",
                            "Flying vehicle with rotors",
                        ],

                        // Objects (yellow cluster)
                        [
                            3.0,
                            -3.0,
                            0.5,
                            "Phone",
                            "objects",
                            "Communication device",
                        ],
                        [
                            3.5,
                            -2.5,
                            0.8,
                            "Computer",
                            "objects",
                            "Electronic computing device",
                        ],
                        [
                            2.8,
                            -3.2,
                            0.2,
                            "Book",
                            "objects",
                            "Written or printed work",
                        ],
                        [
                            4.0,
                            -2.8,
                            0.4,
                            "Chair",
                            "objects",
                            "Furniture for sitting",
                        ],
                        [
                            3.8,
                            -3.5,
                            0.7,
                            "Table",
                            "objects",
                            "Furniture with flat surface",
                        ],
                        [
                            4.2,
                            -3.0,
                            0.3,
                            "Lamp",
                            "objects",
                            "Light source on a stand",
                        ],
                    ];

                    // Define colors for different categories
                    const categoryColors = {
                        animals: 0x4285f4, // Blue
                        vehicles: 0xea4335, // Red
                        objects: 0xfbbc05, // Yellow
                    };

                    // Track all objects for raycasting - more efficient structure
                    const allPoints = [];

                    // Lower polygon spheres for better performance
                    const pointGeometry = new THREE.SphereGeometry(0.15, 12, 8); // Reduced segments

                    // Reuse materials for better performance
                    const materials = {
                        animals: new THREE.MeshLambertMaterial({
                            color: categoryColors.animals,
                        }),
                        vehicles: new THREE.MeshLambertMaterial({
                            color: categoryColors.vehicles,
                        }),
                        objects: new THREE.MeshLambertMaterial({
                            color: categoryColors.objects,
                        }),
                    };

                    // Create efficient text sprites - precompute once per category
                    const labelTextures = {};

                    function createLabelTexture(text) {
                        if (labelTextures[text]) {
                            return labelTextures[text];
                        }

                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.width = 128;
                        canvas.height = 64;

                        // Simple background
                        context.fillStyle = "rgba(0, 0, 0, 0.7)";
                        context.fillRect(0, 0, canvas.width, canvas.height);

                        // Text
                        context.font = "16px Arial";
                        context.fillStyle = "white";
                        context.textAlign = "center";
                        context.textBaseline = "middle";
                        context.fillText(
                            text,
                            canvas.width / 2,
                            canvas.height / 2,
                        );

                        const texture = new THREE.CanvasTexture(canvas);
                        labelTextures[text] = texture;
                        return texture;
                    }

                    // Create points and labels for each data point - more efficient
                    embeddingData.forEach(
                        ([x, y, z, label, category, description]) => {
                            // Create point using shared geometry and material
                            const point = new THREE.Mesh(
                                pointGeometry,
                                materials[category],
                            );
                            point.position.set(x, y, z);
                            point.userData = { label, category, description };
                            scene.add(point);
                            allPoints.push(point);

                            // Create sprite for label
                            const texture = createLabelTexture(label);
                            const spriteMaterial = new THREE.SpriteMaterial({
                                map: texture,
                            });
                            const sprite = new THREE.Sprite(spriteMaterial);
                            sprite.position.set(x, y + 0.5, z);
                            sprite.scale.set(1.2, 0.6, 1);
                            scene.add(sprite);
                        },
                    );

                    // Create axes - simplified
                    function createAxis(start, end, color) {
                        const points = [];
                        points.push(new THREE.Vector3(...start));
                        points.push(new THREE.Vector3(...end));

                        const geometry =
                            new THREE.BufferGeometry().setFromPoints(points);
                        const material = new THREE.LineBasicMaterial({ color });
                        return new THREE.Line(geometry, material);
                    }

                    // Add axes with modest length
                    const axisLength = 8;
                    scene.add(
                        createAxis([0, 0, 0], [axisLength, 0, 0], 0xff5555),
                    ); // X-axis (red)
                    scene.add(
                        createAxis([0, 0, 0], [0, axisLength, 0], 0x55ff55),
                    ); // Y-axis (green)
                    scene.add(
                        createAxis([0, 0, 0], [0, 0, axisLength], 0x5555ff),
                    ); // Z-axis (blue)

                    // Add axis labels - simplified
                    function createAxisLabel(text, position, color) {
                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.width = 64;
                        canvas.height = 64;

                        context.font = "bold 36px Arial";
                        context.fillStyle = color;
                        context.textAlign = "center";
                        context.textBaseline = "middle";
                        context.fillText(
                            text,
                            canvas.width / 2,
                            canvas.height / 2,
                        );

                        const texture = new THREE.CanvasTexture(canvas);
                        const material = new THREE.SpriteMaterial({
                            map: texture,
                        });
                        const sprite = new THREE.Sprite(material);
                        sprite.position.copy(position);
                        sprite.scale.set(1, 1, 1);
                        scene.add(sprite);
                    }

                    createAxisLabel(
                        "X",
                        new THREE.Vector3(axisLength + 0.5, 0, 0),
                        "#ff5555",
                    );
                    createAxisLabel(
                        "Y",
                        new THREE.Vector3(0, axisLength + 0.5, 0),
                        "#55ff55",
                    );
                    createAxisLabel(
                        "Z",
                        new THREE.Vector3(0, 0, axisLength + 0.5),
                        "#5555ff",
                    );

                    // Raycaster for hover effects - optimized
                    const raycaster = new THREE.Raycaster();
                    const mouse = new THREE.Vector2();
                    let hoveredObject = null;

                    // Event listener for mouse move - throttled for performance
                    let isThrottled = false;

                    function onMouseMove(event) {
                        if (isThrottled) return;
                        isThrottled = true;
                        setTimeout(() => {
                            isThrottled = false;
                        }, 50);

                        // Get container position
                        const rect = container.getBoundingClientRect();

                        // Calculate mouse position relative to container
                        mouse.x =
                            ((event.clientX - rect.left) / rect.width) * 2 - 1;
                        mouse.y =
                            -((event.clientY - rect.top) / rect.height) * 2 + 1;

                        // Position tooltip near cursor
                        tooltipElement.style.left =
                            event.clientX - rect.left + 15 + "px";
                        tooltipElement.style.top =
                            event.clientY - rect.top + 15 + "px";
                    }

                    container.addEventListener("mousemove", onMouseMove);

                    // Handle window resize - throttled
                    function onWindowResize() {
                        camera.aspect =
                            container.clientWidth / container.clientHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(
                            container.clientWidth,
                            container.clientHeight,
                        );
                    }

                    let resizeTimeout;
                    window.addEventListener("resize", function () {
                        clearTimeout(resizeTimeout);
                        resizeTimeout = setTimeout(onWindowResize, 100);
                    });

                    // Stop auto-rotation when user interacts
                    container.addEventListener("mousedown", function () {
                        controls.autoRotate = false;
                    });

                    // Performance monitoring
                    function updateFPS() {
                        frameCount++;
                        const currentTime = performance.now();

                        if (currentTime - lastTime >= 1000) {
                            const fps = Math.round(
                                (frameCount * 1000) / (currentTime - lastTime),
                            );
                            fpsCounter.textContent = `${fps} FPS`;
                            frameCount = 0;
                            lastTime = currentTime;
                        }
                    }

                    // Animation loop - optimized
                    function animate() {
                        requestAnimationFrame(animate);

                        // Update controls
                        controls.update();

                        // Run raycaster for hover effects - only when mouse moves
                        if (!isThrottled) {
                            raycaster.setFromCamera(mouse, camera);
                            const intersects =
                                raycaster.intersectObjects(allPoints);

                            if (intersects.length > 0) {
                                const object = intersects[0].object;

                                // Only update if hovering over a new object
                                if (hoveredObject !== object) {
                                    // Reset previous hover effect if any
                                    if (hoveredObject) {
                                        hoveredObject.scale.set(1, 1, 1);
                                    }

                                    hoveredObject = object;

                                    // Show tooltip with information
                                    tooltipElement.style.display = "block";
                                    tooltipElement.innerHTML = `<strong>${object.userData.label}</strong><br>${object.userData.description}`;

                                    // Highlight effect
                                    object.scale.set(1.5, 1.5, 1.5);
                                }
                            } else {
                                // Reset hover effect if no longer hovering on an object
                                if (hoveredObject) {
                                    hoveredObject.scale.set(1, 1, 1);
                                    hoveredObject = null;
                                    tooltipElement.style.display = "none";
                                }
                            }
                        }

                        // Render scene
                        renderer.render(scene, camera);

                        // Update performance counter
                        updateFPS();
                    }

                    // Start animation
                    animate();

                    // Hide loading message after initialization
                    loadingElement.style.display = "none";
                } catch (error) {
                    console.error("Visualization error:", error);
                    document.getElementById("embedding-loading").textContent =
                        "Error loading visualization: " + error.message;
                }
            }

            // Wait for page to load before initializing
            window.addEventListener("load", initEmbeddingVisualization);
        </script>
    </body>
</html>
