<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title description">
  <title id="title">From snapshot penetration testing to continuous security capability</title>
  <desc id="description">A comparison of a periodic penetration test producing a report with a continuous agentic security capability that finds, validates, prioritizes, and supports remediation in a measured loop.</desc>
  <style>
    :root{--fg:#1f2328;--muted:#57606a;--line:#8c959f;--grid:rgba(140,149,159,.24);--green:#1a7f37;--green-fill:rgba(35,134,54,.12);--amber:#9a6700;--amber-fill:rgba(154,103,0,.14);--grey-fill:rgba(87,96,106,.08);--shadow:rgba(20,24,28,.16)}
    @media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8b949e;--line:#484f58;--grid:rgba(72,79,88,.5);--green:#3fb950;--green-fill:rgba(63,185,80,.16);--amber:#e3b341;--amber-fill:rgba(210,153,34,.18);--grey-fill:rgba(139,148,158,.09);--shadow:rgba(0,0,0,.45)}}
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.lane{stroke:var(--line);stroke-width:1.25}.connector{fill:none;stroke:var(--line);stroke-width:1.5}.box{stroke-width:1.5}.dashed{stroke-dasharray:4 5}
  </style>
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="var(--shadow)"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--line)"/></marker></defs>
  <g class="mono">
    <text x="70" y="102" class="muted" font-size="12" text-anchor="end">TODAY</text><line class="lane" x1="95" y1="98" x2="865" y2="98"/>
    <text x="70" y="338" fill="var(--green)" font-size="12" font-weight="700" text-anchor="end">FUTURE</text><line x1="95" y1="334" x2="865" y2="334" stroke="var(--green)" stroke-width="1.25"/>
  </g>
  <g filter="url(#soft)" class="mono">
    <rect class="box" x="115" y="130" width="150" height="84" rx="8" fill="var(--grey-fill)" stroke="var(--line)"/><rect class="box" x="345" y="130" width="150" height="84" rx="8" fill="var(--grey-fill)" stroke="var(--line)"/><rect class="box" x="575" y="130" width="150" height="84" rx="8" fill="var(--amber-fill)" stroke="var(--amber)"/>
    <rect class="box" x="115" y="365" width="130" height="84" rx="8" fill="var(--green-fill)" stroke="var(--green)"/><rect class="box" x="290" y="365" width="130" height="84" rx="8" fill="var(--green-fill)" stroke="var(--green)"/><rect class="box" x="465" y="365" width="130" height="84" rx="8" fill="var(--amber-fill)" stroke="var(--amber)"/><rect class="box" x="640" y="365" width="130" height="84" rx="8" fill="var(--green-fill)" stroke="var(--green)"/>
  </g>
  <g class="mono" text-anchor="middle">
    <text x="190" y="163" class="fg" font-size="13" font-weight="700">Periodic test</text><text x="190" y="184" class="muted" font-size="11">point-in-time</text><text x="190" y="200" class="muted" font-size="11">assessment</text>
    <text x="420" y="163" class="fg" font-size="13" font-weight="700">Findings report</text><text x="420" y="184" class="muted" font-size="11">hand-off after</text><text x="420" y="200" class="muted" font-size="11">the engagement</text>
    <text x="650" y="163" class="fg" font-size="13" font-weight="700">Remediation</text><text x="650" y="184" class="muted" font-size="11">customer-owned,</text><text x="650" y="200" class="muted" font-size="11">often disconnected</text>
    <text x="180" y="398" class="fg" font-size="12" font-weight="700">Continuous agents</text><text x="180" y="419" class="muted" font-size="10">scout and test</text>
    <text x="355" y="398" class="fg" font-size="12" font-weight="700">Human validation</text><text x="355" y="419" class="muted" font-size="10">verify and prioritize</text>
    <text x="530" y="392" class="fg" font-size="12" font-weight="700">Remediation</text><text x="530" y="407" class="fg" font-size="12" font-weight="700">support</text><text x="530" y="428" class="muted" font-size="10">guide and retest</text>
    <text x="705" y="392" class="fg" font-size="12" font-weight="700">Measured</text><text x="705" y="407" class="fg" font-size="12" font-weight="700">outcomes</text><text x="705" y="428" class="muted" font-size="9">coverage + confidence</text>
  </g>
  <g class="connector" marker-end="url(#arrow)"><path d="M265 172 H337"/><path d="M495 172 H567"/><path d="M245 407 H282"/><path d="M420 407 H457"/><path d="M595 407 H632"/><path class="dashed" d="M705 457 C705 505 180 505 180 457"/></g>
  <g class="mono"><text x="435" y="285" class="muted" font-size="12" text-anchor="middle">isolated snapshot</text><text x="435" y="485" fill="var(--green)" font-size="12" font-weight="700" text-anchor="middle">a repeatable, trusted security capability</text><text x="435" y="521" class="muted" font-size="12" text-anchor="middle">the consultancy provides the system, specialist judgment, and proof that it works</text></g>
</svg>
