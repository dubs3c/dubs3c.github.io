<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img"
     aria-label="The vulnerability pyramid: three tiers from common to deep vulnerabilities">
  <title>The Vulnerability Pyramid</title>
  <style>
    :root{
      --fg:#1f2328;
      --muted:#57606a;
      --line:#8c959f;
      --f1:rgba(35,134,54,0.12);  --s1:#1a7f37;
      --f2:rgba(154,103,0,0.16);  --s2:#9a6700;
      --f3:rgba(207,34,46,0.12);  --s3:#cf222e;
      --shadow:rgba(20,24,28,0.16);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --fg:#e6edf3;
        --muted:#8b949e;
        --line:#484f58;
        --f1:rgba(63,185,80,0.16);  --s1:#3fb950;
        --f2:rgba(210,153,34,0.18); --s2:#e3b341;
        --f3:rgba(248,81,73,0.16);  --s3:#ff7b72;
        --shadow:rgba(0,0,0,0.45);
      }
    }
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .fg{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .tier{stroke-width:2;stroke-linejoin:round;}
    .t1{fill:var(--f1);stroke:var(--s1);}
    .t2{fill:var(--f2);stroke:var(--s2);}
    .t3{fill:var(--f3);stroke:var(--s3);}
    .lbl1{fill:var(--s1);} .lbl2{fill:var(--s2);} .lbl3{fill:var(--s3);}
    .conn{stroke:var(--line);stroke-width:1.25;stroke-dasharray:3 4;fill:none;}
  </style>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="var(--shadow)"/>
    </filter>
  </defs>


  <!-- left axis -->
  <g class="mono">
    <line x1="40" y1="470" x2="40" y2="98" stroke="var(--line)" stroke-width="1.25"/>
    <path d="M40 92 l-4 8 h8 z" fill="var(--line)"/>
    <text x="26" y="285" class="muted" font-size="11" text-anchor="middle"
          transform="rotate(-90 26 285)">difficulty  ·  rarity  ·  value</text>
  </g>

  <!-- pyramid -->
  <g filter="url(#soft)">
    <!-- bottom tier -->
    <polygon class="tier t1" points="60,470 560,470 480,343 140,343"/>
    <!-- middle tier -->
    <polygon class="tier t2" points="147,331 473,331 397,209 223,209"/>
    <!-- top tier -->
    <polygon class="tier t3" points="310,70 390,197 230,197"/>
  </g>

  <!-- inside-tier labels -->
  <g class="mono" text-anchor="middle" font-weight="700">
    <text x="310" y="416" class="fg" font-size="16">Common</text>
    <text x="310" y="277" class="fg" font-size="15">Complex</text>
    <text x="310" y="168" class="fg" font-size="12">Deep</text>
  </g>

  <!-- connectors -->
  <g>
    <path class="conn" d="M349 133 H590"/>
    <circle cx="349" cy="133" r="2.5" fill="var(--s3)"/>
    <path class="conn" d="M435 270 H590"/>
    <circle cx="435" cy="270" r="2.5" fill="var(--s2)"/>
    <path class="conn" d="M520 406 H590"/>
    <circle cx="520" cy="406" r="2.5" fill="var(--s1)"/>
  </g>

  <!-- right annotations -->
  <g class="mono">
    <!-- top -->
    <rect x="600" y="115" width="12" height="12" rx="2.5" fill="var(--s3)"/>
    <text x="622" y="125" class="fg" font-size="15" font-weight="700">Deep vulnerabilities</text>
    <text x="600" y="147" class="muted" font-size="12">Nuanced, chained, hard to identify</text>
    <text x="600" y="165" class="lbl3" font-size="12">Top human + AI expertise · few operate here</text>

    <!-- middle -->
    <rect x="600" y="252" width="12" height="12" rx="2.5" fill="var(--s2)"/>
    <text x="622" y="262" class="fg" font-size="15" font-weight="700">Complex vulnerabilities</text>
    <text x="600" y="284" class="muted" font-size="12">Cross-service integrations, runtime context, data flows</text>
    <text x="600" y="302" class="lbl2" font-size="12">Needs custom pipelines &amp; context engineering</text>

    <!-- bottom -->
    <rect x="600" y="388" width="12" height="12" rx="2.5" fill="var(--s1)"/>
    <text x="622" y="398" class="fg" font-size="15" font-weight="700">Common vulnerabilities</text>
    <text x="600" y="420" class="muted" font-size="12">Broken access control, IDOR, XSS, injection, race conditions</text>
    <text x="600" y="438" class="lbl1" font-size="12">Eliminated by frontier coding agents</text>
  </g>

  <!-- caption -->
  <text x="310" y="502" class="mono muted" font-size="12" text-anchor="middle">width &#8776; how common   ·   height &#8776; expertise required</text>
</svg>
