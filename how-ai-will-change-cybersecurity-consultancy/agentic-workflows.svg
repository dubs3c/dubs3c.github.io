<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img"
     aria-labelledby="title description">
  <title id="title">Agentic workflows accelerate security assessments</title>
  <desc id="description">A timeline chart comparing traditional and agentic white-box security assessments. Agentic workflows build system understanding and uncover vulnerabilities much earlier in the assignment.</desc>
  <style>
    :root{
      --fg:#1f2328;
      --muted:#57606a;
      --line:#8c959f;
      --grid:rgba(140,149,159,0.24);
      --agent-fill:rgba(35,134,54,0.12);
      --agent:#1a7f37;
      --traditional-fill:rgba(87,96,106,0.08);
      --traditional:#57606a;
      --lead-fill:rgba(154,103,0,0.14);
      --lead:#9a6700;
      --shadow:rgba(20,24,28,0.16);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --fg:#e6edf3;
        --muted:#8b949e;
        --line:#484f58;
        --grid:rgba(72,79,88,0.5);
        --agent-fill:rgba(63,185,80,0.16);
        --agent:#3fb950;
        --traditional-fill:rgba(139,148,158,0.09);
        --traditional:#8b949e;
        --lead-fill:rgba(210,153,34,0.18);
        --lead:#e3b341;
        --shadow:rgba(0,0,0,0.45);
      }
    }
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    .fg{fill:var(--fg);}
    .muted{fill:var(--muted);}
    .grid{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 5;}
    .axis{stroke:var(--line);stroke-width:1.25;}
    .agent-line{fill:none;stroke:var(--agent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .traditional-line{fill:none;stroke:var(--traditional);stroke-width:2.25;stroke-dasharray:6 6;stroke-linecap:round;stroke-linejoin:round;}
    .connector{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:3 4;}
  </style>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="var(--shadow)"/>
    </filter>
    <clipPath id="plot-clip">
      <rect x="90" y="70" width="560" height="390"/>
    </clipPath>
  </defs>

  <!-- plot grid and axes -->
  <g class="mono">
    <line class="grid" x1="90" y1="330" x2="650" y2="330"/>
    <line class="grid" x1="90" y1="200" x2="650" y2="200"/>
    <line class="grid" x1="277" y1="70" x2="277" y2="460"/>
    <line class="grid" x1="463" y1="70" x2="463" y2="460"/>

    <line class="axis" x1="90" y1="460" x2="658" y2="460"/>
    <path d="M664 460 l-8 -4 v8 z" fill="var(--line)"/>
    <line class="axis" x1="90" y1="460" x2="90" y2="62"/>
    <path d="M90 56 l-4 8 h8 z" fill="var(--line)"/>

    <text x="90" y="484" class="muted" font-size="11" text-anchor="middle">start</text>
    <text x="277" y="484" class="muted" font-size="11" text-anchor="middle">early</text>
    <text x="463" y="484" class="muted" font-size="11" text-anchor="middle">midpoint</text>
    <text x="650" y="484" class="muted" font-size="11" text-anchor="middle">end</text>
    <text x="370" y="516" class="muted" font-size="12" text-anchor="middle">assignment timeline</text>
    <text x="40" y="265" class="muted" font-size="11" text-anchor="middle"
          transform="rotate(-90 40 265)">system understanding  ·  vulnerabilities found</text>
  </g>

  <!-- cumulative progress curves -->
  <g clip-path="url(#plot-clip)" filter="url(#soft)">
    <path d="M90 460 C150 446 188 397 235 330 C290 251 355 181 430 132 C500 87 570 76 650 73 L650 460 Z"
          fill="var(--agent-fill)"/>
    <path d="M90 460 C210 459 300 443 370 400 C445 354 505 262 555 185 C590 131 620 93 650 78 L650 460 Z"
          fill="var(--traditional-fill)"/>
    <path d="M90 460 C150 446 188 397 235 330 C290 251 355 181 430 132 C500 87 570 76 650 73"
          class="agent-line"/>
    <path d="M90 460 C210 459 300 443 370 400 C445 354 505 262 555 185 C590 131 620 93 650 78"
          class="traditional-line"/>
  </g>

  <!-- early advantage marker -->
  <g class="mono">
    <line x1="277" y1="267" x2="277" y2="434" stroke="var(--lead)" stroke-width="1.5"/>
    <path d="M277 263 l-4 8 h8 z" fill="var(--lead)"/>
    <path d="M277 438 l-4 -8 h8 z" fill="var(--lead)"/>
    <rect x="302" y="332" width="117" height="37" rx="5" fill="var(--lead-fill)" stroke="var(--lead)"/>
    <text x="360.5" y="347" fill="var(--lead)" font-size="10" font-weight="700" text-anchor="middle">EARLY ADVANTAGE</text>
    <text x="360.5" y="360" class="muted" font-size="9" text-anchor="middle">more leads, sooner</text>
  </g>

  <!-- curve labels and annotations -->
  <g class="mono">
    <circle cx="421" cy="138" r="3" fill="var(--agent)"/>
    <path class="connector" d="M421 138 H686"/>
    <rect x="696" y="104" width="12" height="12" rx="2.5" fill="var(--agent)"/>
    <text x="718" y="114" class="fg" font-size="15" font-weight="700">Agentic workflow</text>
    <text x="696" y="137" class="muted" font-size="12">Maps code, traces data flows,</text>
    <text x="696" y="155" class="muted" font-size="12">and tests leads in parallel</text>
    <text x="696" y="178" fill="var(--agent)" font-size="12">Understanding compounds early</text>

    <circle cx="541" cy="207" r="3" fill="var(--traditional)"/>
    <path class="connector" d="M541 207 H686"/>
    <rect x="696" y="224" width="12" height="12" rx="2.5" fill="var(--traditional)"/>
    <text x="718" y="234" class="fg" font-size="15" font-weight="700">Traditional workflow</text>
    <text x="696" y="257" class="muted" font-size="12">Context builds sequentially;</text>
    <text x="696" y="275" class="muted" font-size="12">findings cluster near the end</text>

    <text x="696" y="337" class="fg" font-size="13" font-weight="700">Same assignment window.</text>
    <text x="696" y="360" fill="var(--lead)" font-size="13" font-weight="700">More time to validate</text>
    <text x="696" y="378" fill="var(--lead)" font-size="13" font-weight="700">and deepen findings.</text>
  </g>

  <!-- caption -->
  <text x="370" y="545" class="mono muted" font-size="12" text-anchor="middle">cumulative progress  ·  illustrative comparison</text>
</svg>
