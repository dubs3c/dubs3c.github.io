<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title description">
  <title id="title">Customer self-service and consultancy value</title>
  <desc id="description">A matrix showing that routine vulnerabilities can increasingly be handled by customer-run agents, while complex and deep vulnerabilities require tailored workflows, validation, and specialist expertise.</desc>
  <style>
    :root{--fg:#1f2328;--muted:#57606a;--line:#8c959f;--grid:rgba(140,149,159,.24);--green:#1a7f37;--green-fill:rgba(35,134,54,.12);--amber:#9a6700;--amber-fill:rgba(154,103,0,.16);--red:#cf222e;--red-fill:rgba(207,34,46,.12);--shadow:rgba(20,24,28,.16)}
    @media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8b949e;--line:#484f58;--grid:rgba(72,79,88,.5);--green:#3fb950;--green-fill:rgba(63,185,80,.16);--amber:#e3b341;--amber-fill:rgba(210,153,34,.18);--red:#ff7b72;--red-fill:rgba(248,81,73,.16);--shadow:rgba(0,0,0,.45)}}
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.axis{stroke:var(--line);stroke-width:1.25}.grid{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 5}.zone{stroke-width:1.5}.conn{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:3 4}
  </style>
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="var(--shadow)"/></filter></defs>
  <g class="mono">
    <line class="grid" x1="100" y1="185" x2="650" y2="185"/><line class="grid" x1="100" y1="320" x2="650" y2="320"/>
    <line class="axis" x1="100" y1="455" x2="660" y2="455"/><path d="M666 455 l-8 -4 v8 z" fill="var(--line)"/>
    <line class="axis" x1="100" y1="455" x2="100" y2="70"/><path d="M100 64 l-4 8 h8 z" fill="var(--line)"/>
    <text x="100" y="480" class="muted" font-size="11" text-anchor="middle">low</text><text x="650" y="480" class="muted" font-size="11" text-anchor="middle">high</text>
    <text x="375" y="516" class="muted" font-size="12" text-anchor="middle">customer ability to self-serve with agents</text>
    <text x="50" y="262" class="muted" font-size="11" text-anchor="middle" transform="rotate(-90 50 262)">vulnerability and system complexity</text>
    <text x="82" y="450" class="muted" font-size="11" text-anchor="end">routine</text><text x="82" y="78" class="muted" font-size="11" text-anchor="end">deep</text>
  </g>
  <g filter="url(#soft)">
    <rect class="zone" x="330" y="343" width="290" height="80" rx="8" fill="var(--green-fill)" stroke="var(--green)"/>
    <rect class="zone" x="205" y="217" width="330" height="84" rx="8" fill="var(--amber-fill)" stroke="var(--amber)"/>
    <rect class="zone" x="120" y="91" width="300" height="84" rx="8" fill="var(--red-fill)" stroke="var(--red)"/>
  </g>
  <g class="mono">
    <text x="475" y="373" class="fg" font-size="14" font-weight="700" text-anchor="middle">Customer-run agents</text><text x="475" y="394" class="muted" font-size="11" text-anchor="middle">routine discovery and remediation</text><text x="475" y="411" fill="var(--green)" font-size="11" text-anchor="middle">consultancy value is commoditized</text>
    <text x="370" y="249" class="fg" font-size="14" font-weight="700" text-anchor="middle">Tailored agentic capability</text><text x="370" y="270" class="muted" font-size="11" text-anchor="middle">context, integrations, and evaluation</text><text x="370" y="287" fill="var(--amber)" font-size="11" text-anchor="middle">consultancy designs and validates the system</text>
    <text x="270" y="123" class="fg" font-size="14" font-weight="700" text-anchor="middle">Specialist-led assurance</text><text x="270" y="144" class="muted" font-size="11" text-anchor="middle">deep expertise guides AI investigation</text><text x="270" y="161" fill="var(--red)" font-size="11" text-anchor="middle">consultancy leads the engagement</text>
    <path class="conn" d="M620 382 H695"/><path class="conn" d="M535 259 H695"/><path class="conn" d="M420 133 H695"/>
    <text x="715" y="142" class="fg" font-size="13" font-weight="700">Where consultancies win</text><text x="715" y="165" class="muted" font-size="11">The service moves upward:</text><text x="715" y="185" class="muted" font-size="11">from finding routine issues</text><text x="715" y="205" class="muted" font-size="11">to building, proving, and</text><text x="715" y="225" class="muted" font-size="11">operating trusted capability.</text>
  </g>
  <text x="375" y="545" class="mono muted" font-size="12" text-anchor="middle">illustrative operating boundary, not a fixed classification</text>
</svg>
